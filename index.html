<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOEIC 對話聽力測驗生成器 (Gemini 智慧備援版)</title>
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --card: #ffffff; --text: #1e293b; --border: #e2e8f0; }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; line-height: 1.6; }
        .container { max-width: 600px; margin: auto; background: var(--card); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        h1 { font-size: 1.5rem; text-align: center; color: var(--primary); margin-top: 0; }
        .section { margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
        .section:last-child { border-bottom: none; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input[type="text"], input[type="password"], input[type="file"] { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid var(--border); border-radius: 6px; }
        button { background: var(--primary); color: white; border: none; padding: 12px 15px; border-radius: 6px; cursor: pointer; width: 100%; font-size: 1rem; margin-bottom: 10px; font-weight: bold;}
        button:disabled { background: #94a3b8; cursor: not-allowed; }
        button.secondary { background: #475569; }
        button.success { background: #10b981; }
        .status { text-align: center; font-size: 0.9rem; color: #64748b; margin-bottom: 10px; font-weight: bold; min-height: 1.5em;}
        .quiz-container { display: none; }
        .question { margin-bottom: 20px; }
        .question p { font-weight: bold; margin-bottom: 10px; }
        .options label { display: block; font-weight: normal; margin: 5px 0; padding: 10px; background: #f1f5f9; border-radius: 6px; cursor: pointer; border: 1px solid transparent; }
        .options input { margin-right: 10px; }
        .options label.correct { background: #dcfce7; border-color: #22c55e; color: #166534; font-weight: bold; }
        .options label.wrong { background: #fee2e2; border-color: #ef4444; color: #991b1b; }
        .transcript { display: none; background: #f1f5f9; padding: 15px; border-radius: 6px; margin-top: 20px; white-space: pre-wrap; font-size: 0.95rem; }
    </style>
</head>
<body>

<div class="container">
    <h1>TOEIC 聽力生成器 <br><span style="font-size: 1rem; color: #64748b;">(自動備援架構)</span></h1>
    
    <div class="section">
        <label>1. API 設定</label>
        <input type="password" id="apiKey" placeholder="輸入 Gemini API Key">
    </div>
    
    <div class="section">
        <label>2. 載入對話與測驗檔案 (.txt)</label>
        <input type="file" id="fileInput" accept=".txt" onchange="handleFileUpload(event)">
        <button class="secondary" onclick="loadExample()">沒有檔案？載入預設範例測試</button>
    </div>

    <div class="section">
        <label>3. 聽力生成與播放</label>
        <button id="generateBtn" onclick="generateAllAudio()" disabled>生成聽力音檔（必要時切換備援模型）</button>
        <div class="status" id="status">請先載入題目文字檔</div>
        
        <!-- 使用原生播放器以完美相容手機與修復解碼問題 -->
        <audio id="audioPlayer" controls style="width: 100%; display: none; margin-top: 10px;"></audio>
    </div>

    <div class="quiz-container" id="quizContainer">
        <div class="section">
            <label>4. 測驗區</label>
            <div id="quizArea"></div>
            <button onclick="checkAnswers()" style="margin-top: 15px;">送出答案</button>
        </div>
        <div class="section" style="border: none;">
            <button class="secondary" onclick="toggleTranscript()">顯示 / 隱藏 對話原文</button>
            <div id="transcript" class="transcript"></div>
        </div>
    </div>
</div>

<script>
    // 預先對應 Gemini 的人聲 (依據口音與性別配置)
    const voiceMap = {
        'Male_US': 'Puck', 'Female_US': 'Kore',
        'Male_UK': 'Fenrir', 'Female_UK': 'Leda',
        'Male_Aussie': 'Orus', 'Female_Aussie': 'Aoede'
    };

    let parsedData = null;

    // --- 1. TXT 解析邏輯 ---
    function parseTXT(text) {
        let speakerA = { gender: 'Male', accent: 'US' };
        let speakerB = { gender: 'Female', accent: 'UK' };
        let dialogue = [];
        let questions = [];

        const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
        let section = '';
        let currentQ = null;

        for (let line of lines) {
            if (line.match(/^\[.*\]$/)) {
                section = line.toLowerCase();
                continue;
            }
            if (section.includes('speaker') || section.includes('設定')) {
                let m = line.match(/Speaker\s*(A|B):\s*(Male|Female)\s*,\s*(US|UK|Aussie)/i);
                if (m) {
                    let spk = { gender: m[2], accent: m[3] };
                    if (m[1].toUpperCase() === 'A') speakerA = spk;
                    else speakerB = spk;
                }
            } else if (section.includes('dialogue') || section.includes('對話')) {
                let m = line.match(/^(A|B):\s*(.*)/);
                if (m) dialogue.push({ speaker: m[1], text: m[2] });
            } else if (section.includes('question') || section.includes('題目')) {
                if (line.match(/^Q\d+:/i)) {
                    if (currentQ) questions.push(currentQ);
                    currentQ = { question: line, options: [], ans: '' };
                } else if (line.match(/^[\(]?([A-D])[\)\.]?\s+(.*)/i)) {
                    if (currentQ) {
                        let m = line.match(/^[\(]?([A-D])[\)\.]?\s+(.*)/i);
                        currentQ.options.push(`(${m[1].toUpperCase()}) ${m[2]}`);
                    }
                } else if (line.match(/^Ans:\s*([A-D])/i)) {
                    if (currentQ) {
                        currentQ.ans = line.match(/^Ans:\s*([A-D])/i)[1].toUpperCase();
                        questions.push(currentQ);
                        currentQ = null;
                    }
                }
            }
        }
        if (currentQ) questions.push(currentQ);
        if (dialogue.length === 0) throw new Error("解析失敗：找不到對話內容");
        return { speakerA, speakerB, dialogue, questions };
    }

    // --- 2. 核心工具：將 Base64 PCM / WAV 自動封裝成標準可播放的 WAV Blob ---
    function base64ToWavBlob(base64Data, sampleRate = 24000) {
        const binaryString = atob(base64Data);
        const len = binaryString.length;
        const bytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) {
            bytes[i] = binaryString.charCodeAt(i);
        }

        // 檢查前 4 個 Byte 是否已有 'RIFF'（若已有標頭直接返回）
        if (bytes.length >= 4 && bytes[0] === 0x52 && bytes[1] === 0x49 && bytes[2] === 0x46 && bytes[3] === 0x46) {
            return new Blob([bytes], { type: 'audio/wav' });
        }

        // 否則為原始 PCM，主動添加 44-byte WAV RIFF 標頭
        const numChannels = 1, bitDepth = 16;
        const byteRate = sampleRate * numChannels * (bitDepth / 8);
        const blockAlign = numChannels * (bitDepth / 8);
        const buffer = new ArrayBuffer(44 + bytes.length);
        const view = new DataView(buffer);

        function writeString(view, offset, string) {
            for (let i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i));
        }

        writeString(view, 0, 'RIFF');
        view.setUint32(4, 36 + bytes.length, true);
        writeString(view, 8, 'WAVE');
        writeString(view, 12, 'fmt ');
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true); 
        view.setUint16(22, numChannels, true);
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, byteRate, true);
        view.setUint16(32, blockAlign, true);
        view.setUint16(34, bitDepth, true);
        writeString(view, 36, 'data');
        view.setUint32(40, bytes.length, true);
        
        new Uint8Array(buffer, 44).set(bytes);
        return new Blob([buffer], { type: 'audio/wav' });
    }

    // --- 3. Gemini TTS：依錯誤類型控制 Fallback，避免無效 API 呼叫 ---
    async function callGeminiMultiSpeakerTTS(dialogue, voiceA, voiceB, apiKey) {
        // 目前官方多人 TTS 文件列出的模型。移除未列於目前多人 TTS 支援清單的
        // gemini-2.5-flash-preview-tts，避免在所有備援都失敗時多打一個無效請求。
        const modelQueue = [
            'gemini-3.8-flash-tts',
            'gemini-3.8-flash-lite-tts',
            'gemini-3.1-flash-tts-preview',
            'gemini-2.5-pro-preview-tts'
        ];

        if (!Array.isArray(dialogue) || dialogue.length === 0) {
            throw new Error('對話內容為空，無法生成音訊。');
        }
        if (!apiKey) {
            throw new Error('缺少 Gemini API Key。');
        }

        // 每個發言回合都獨立成一個 Part，並以 speech_metadata 指定 speaker。
        // 不再把「A: / B:」當成要朗讀的逐字稿內容。
        const parts = dialogue.map((turn, index) => {
            const speaker = String(turn.speaker || '').toUpperCase();
            if (!['A', 'B'].includes(speaker) || !String(turn.text || '').trim()) {
                throw new Error(`第 ${index + 1} 句對話格式錯誤：發言者必須是 A 或 B，且文字不可空白。`);
            }
            return {
                text: String(turn.text).trim(),
                speech_metadata: { speaker }
            };
        });

        const payload = {
            contents: [{ role: 'user', parts }],
            generationConfig: {
                responseModalities: ['AUDIO'],
                speechConfig: {
                    multiSpeakerVoiceConfig: {
                        speakerVoiceConfigs: [
                            {
                                speaker: 'A',
                                voiceConfig: {
                                    prebuiltVoiceConfig: { voiceName: voiceA }
                                }
                            },
                            {
                                speaker: 'B',
                                voiceConfig: {
                                    prebuiltVoiceConfig: { voiceName: voiceB }
                                }
                            }
                        ]
                    }
                }
            }
        };

        const statusEl = document.getElementById('status');
        const attemptErrors = [];
        let successfulResponseWithoutAudio = false;

        // 這些通常是共通的請求／帳號問題；換模型不會修好它們。
        const STOP_STATUSES = new Set([400, 401, 402, 403, 429]);
        // 404 通常是該模型或資源不可用，可嘗試下一個模型；500/503 等為暫時性服務錯誤。
        const FALLBACK_STATUSES = new Set([404, 408, 500, 502, 503, 504]);

        function isClearlyModelScopedShortWindowLimit(errorObject, message) {
            // 429 範圍不明時預設停止，因為它可能是專案 RPD、支出或其他共用配額。
            // 只有 Google 的詳細 quota metadata 明確指出「按模型」的 RPM/TPM 限制，
            // 才切換模型；單看 message 裡的模型名稱並不足以判定為 model-scoped。
            const detailsText = JSON.stringify(errorObject?.details || []).toLowerCase();
            const fullText = `${detailsText} ${String(message || '').toLowerCase()}`;
            const modelScoped = /per[_ -]?model|permodel/.test(fullText);
            const shortWindowLimit = /\brpm\b|\btpm\b|per[_ -]?minute|requests?\s+per\s+minute|tokens?\s+per\s+minute/.test(fullText);
            const dailyOrSpendLimit = /\brpd\b|per[_ -]?day|requests?\s+per\s+day|daily|spend|prepay|credit balance/.test(fullText);
            return modelScoped && shortWindowLimit && !dailyOrSpendLimit;
        }

        for (let index = 0; index < modelQueue.length; index++) {
            const model = modelQueue[index];
            statusEl.textContent = `正在呼叫 ${model}（${index + 1}/${modelQueue.length}）…`;

            let response;
            try {
                response = await fetch(
                    `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`,
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'x-goog-api-key': apiKey
                        },
                        body: JSON.stringify(payload)
                    }
                );
            } catch (err) {
                // TypeError 等通常代表離線、DNS、CORS 或網路層錯誤；重送相同請求到多個模型
                // 不會修復共同的網路問題，且可能讓呼叫數難以預測，因此直接停止。
                console.error(`[TTS] ${model} 網路層錯誤，停止備援。`, err);
                const networkError = new Error(
                    `連線 Gemini API 失敗，已停止備援以避免重複呼叫。請檢查網路、CORS 或瀏覽器環境。(${err.message || 'network error'})`
                );
                networkError.code = 'NETWORK_ERROR';
                throw networkError;
            }

            let data = null;
            let rawBody = '';
            try {
                rawBody = await response.text();
                data = rawBody ? JSON.parse(rawBody) : {};
            } catch (_) {
                data = {};
            }

            if (!response.ok) {
                const apiError = data?.error || {};
                const apiMessage = apiError.message || rawBody || `HTTP ${response.status}`;
                const errorCode = apiError.status || `HTTP_${response.status}`;
                const detail = `${model}：HTTP ${response.status} ${errorCode} — ${apiMessage}`;
                attemptErrors.push(detail);

                console.warn(`[TTS] ${detail}`);

                const modelScoped429 = response.status === 429 &&
                    isClearlyModelScopedShortWindowLimit(apiError, apiMessage);
                if (STOP_STATUSES.has(response.status) && !modelScoped429) {
                    // 400 請求格式、401/403 鑑權或權限、402 帳單，以及範圍不明的 429：停止。
                    throw new Error(`已停止備援，避免無效的連續 API 呼叫。\n${detail}`);
                }

                if (!FALLBACK_STATUSES.has(response.status) && !modelScoped429) {
                    // 未明確列為可備援的錯誤，預設 fail-closed。
                    throw new Error(`遇到未分類的 API 錯誤，已停止備援。\n${detail}`);
                }

                if (index < modelQueue.length - 1) {
                    statusEl.textContent = `${model} 暫時不可用，改試下一個模型…`;
                    if ([408, 429, 500, 502, 503, 504].includes(response.status)) {
                        // 對暫時性服務錯誤採用短版指數退避，避免連續敲擊服務端。
                        const delayMs = Math.min(250 * (2 ** index), 1000) + Math.floor(Math.random() * 150);
                        await new Promise(resolve => setTimeout(resolve, delayMs));
                    }
                    continue;
                }
                break;
            }

            const audioData = data?.candidates?.[0]?.content?.parts?.find(
                part => part?.inlineData?.data || part?.inline_data?.data
            );
            const base64Audio = audioData?.inlineData?.data || audioData?.inline_data?.data;
            if (base64Audio) {
                statusEl.textContent = `成功！(${model})`;
                return base64Audio;
            }

            successfulResponseWithoutAudio = true;
            const finishReason = data?.candidates?.[0]?.finishReason || '未提供 finishReason';
            const noAudioDetail = `${model}：HTTP 200，但回應中沒有 inlineData 音訊（finishReason: ${finishReason}）。`;
            attemptErrors.push(noAudioDetail);
            console.warn(`[TTS] ${noAudioDetail}`, data);

            if (index < modelQueue.length - 1) {
                statusEl.textContent = `${model} 未回傳音訊，改試下一個模型…`;
                continue;
            }
        }

        const headline = successfulResponseWithoutAudio
            ? 'Gemini API 有回應，但未回傳可用音訊。'
            : '所有可用的多人 TTS 模型皆失敗。';
        throw new Error(`${headline}\n\n${attemptErrors.join('\n\n') || '沒有可供診斷的 API 錯誤內容。'}`);
    }

    // --- 4. 生成音檔總控 ---
    async function generateAllAudio() {
        const apiKey = document.getElementById('apiKey').value.trim();
        if (!apiKey) return alert("請輸入 API Key");
        if (!parsedData) return alert("請先載入題目檔案");
        
        const btn = document.getElementById('generateBtn');
        const status = document.getElementById('status');
        const player = document.getElementById('audioPlayer');

        btn.disabled = true;
        player.style.display = 'none';

        try {
            const voiceA = voiceMap[`${parsedData.speakerA.gender}_${parsedData.speakerA.accent}`] || 'Puck';
            const voiceB = voiceMap[`${parsedData.speakerB.gender}_${parsedData.speakerB.accent}`] || 'Kore';

            // 傳入結構化回合，由 TTS API 明確取得每句的 speaker metadata。
            const b64 = await callGeminiMultiSpeakerTTS(parsedData.dialogue, voiceA, voiceB, apiKey);
            
            // 透過轉換器建立標準 WAV Blob URL
            const wavBlob = base64ToWavBlob(b64, 24000);
            
            // 如果之前有舊的 URL，釋放記憶體
            if(player.src) URL.revokeObjectURL(player.src);
            const audioUrl = URL.createObjectURL(wavBlob);

            // 綁定到原生播放器，準備播放
            player.src = audioUrl;
            player.style.display = 'block';
            status.innerText += ' 音檔已就緒！請使用下方播放器播放。';
            
        } catch (err) {
            status.innerText = '生成失敗；請查看錯誤詳情。';
            alert("錯誤詳情: \n" + err.message);
        } finally {
            btn.disabled = false;
        }
    }

    // --- 5. UI 與測驗互動 ---
    function handleFileUpload(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                parsedData = parseTXT(e.target.result);
                renderQuiz(parsedData.questions);
                document.getElementById('status').innerText = '檔案載入成功，請點擊「生成聽力音檔」。';
                document.getElementById('generateBtn').disabled = false;
            } catch (err) {
                document.getElementById('status').innerText = err.message;
            }
        };
        reader.readAsText(file);
    }

    function renderQuiz(questions) {
        const container = document.getElementById('quizArea');
        container.innerHTML = '';
        questions.forEach((q, qIndex) => {
            let div = document.createElement('div');
            div.className = 'question';
            div.innerHTML = `<p>${q.question}</p>`;
            let optDiv = document.createElement('div');
            optDiv.className = 'options';
            q.options.forEach((opt) => {
                let val = opt.match(/^\(([A-D])\)/)[1];
                optDiv.innerHTML += `
                    <label id="label_q${qIndex}_${val}">
                        <input type="radio" name="q${qIndex}" value="${val}"> ${opt}
                    </label>`;
            });
            div.appendChild(optDiv);
            container.appendChild(div);
        });
        document.getElementById('quizContainer').style.display = 'block';
    }

    function checkAnswers() {
        let score = 0;
        parsedData.questions.forEach((q, qIndex) => {
            const radios = document.getElementsByName(`q${qIndex}`);
            let selected = null;
            radios.forEach(r => { if (r.checked) selected = r.value; });
            
            ['A','B','C','D'].forEach(opt => {
                let el = document.getElementById(`label_q${qIndex}_${opt}`);
                if (el) el.className = '';
            });

            if (selected === q.ans) {
                score++;
                document.getElementById(`label_q${qIndex}_${selected}`).classList.add('correct');
            } else {
                if (selected) document.getElementById(`label_q${qIndex}_${selected}`).classList.add('wrong');
                if (document.getElementById(`label_q${qIndex}_${q.ans}`)) {
                    document.getElementById(`label_q${qIndex}_${q.ans}`).classList.add('correct');
                }
            }
        });
        alert(`測驗結束！您的分數為：${score} / ${parsedData.questions.length}`);
    }

    function toggleTranscript() {
        const ts = document.getElementById('transcript');
        if (ts.style.display === 'none' || ts.style.display === '') {
            ts.style.display = 'block';
            ts.innerText = parsedData.dialogue.map(d => `${d.speaker}: ${d.text}`).join('\n\n');
        } else {
            ts.style.display = 'none';
        }
    }

    function loadExample() {
        const exampleTXT = `[Speaker Settings]
Speaker A: Male, Aussie
Speaker B: Female, US

[Dialogue]
A: Good morning! I'm calling about the graphic design position you advertised.
B: Yes, of course. We are still accepting applications until this Friday. Have you sent your resume?
A: I'm planning to send it today. Should I attach my portfolio as well?
B: Yes, please include at least three samples of your recent work.

[Questions]
Q1: Why is the man calling?
(A) To ask about a job opening
(B) To apply for a loan
(C) To sell software
(D) To schedule an interview
Ans: A

Q2: What is the man asked to submit with his resume?
(A) A reference letter
(B) A cover letter
(C) Three work samples
(D) A business plan
Ans: C`;
        parsedData = parseTXT(exampleTXT);
        renderQuiz(parsedData.questions);
        document.getElementById('status').innerText = '範例載入成功！輸入 API Key 即可生成音檔。';
        document.getElementById('generateBtn').disabled = false;
    }
</script>
</body>
</html>
