<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#155eef">
<title>TOEIC 聽力練習｜免費 TTS 版</title>
<style>
:root{--primary:#155eef;--bg:#f4f7fb;--card:#fff;--text:#182230;--muted:#667085;--border:#d0d5dd;--red:#b42318;--green:#067647}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto}
h1,h2{text-align:center;line-height:1.25}
h1{font-size:1.6rem;color:var(--primary)}
h2{font-size:1.2rem}
.card{background:var(--card);border:1px solid #eaecf0;border-radius:14px;padding:16px;margin:14px 0;box-shadow:0 2px 8px #1018280a}
label{display:block;font-weight:650;margin:10px 0 5px}
input[type=file],select,input[type=range]{width:100%}
select,button{font:inherit}
select{padding:10px;border:1px solid var(--border);border-radius:8px;background:#fff;width:100%}
button{border:0;border-radius:9px;padding:12px 14px;background:var(--primary);color:white;font-weight:700;cursor:pointer;min-height:44px}
button.secondary{background:#344054}
button.danger{background:#b42318}
button:disabled{opacity:.5;cursor:not-allowed}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
#status{padding:10px;border-radius:8px;background:#f2f4f7;margin-top:10px;overflow-wrap:anywhere}
#status.error{color:var(--red);background:#fef3f2}
#status.ok{color:var(--green);background:#ecfdf3}
.hint{color:var(--muted);font-size:.92rem}
#player-section,#quiz-section,#result-section,#transcript-section{display:none}
.question{padding:12px 0;border-bottom:1px solid #eaecf0}
.option{display:flex;gap:9px;align-items:flex-start;font-weight:400;padding:5px 0}
.option input{margin-top:5px;flex:0 0 auto}
.speaker-A{color:#155eef;font-weight:750}.speaker-B{color:#b42318;font-weight:750}
.line{padding:6px 0}
.pill{display:inline-block;background:#eef4ff;color:#3538cd;padding:3px 9px;border-radius:999px;font-size:.82rem}
@media(min-width:600px){.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.settings-grid>div{min-width:0}}
</style>
</head>
<body>
<main>
  <h1>TOEIC 聽力練習</h1>
  <p class="hint" style="text-align:center">免費語音版：使用瀏覽器／裝置提供的語音，不呼叫 ElevenLabs，也不需要 API Key。</p>

  <section class="card" id="setup-section">
    <h2>載入測驗</h2>
    <label for="fileInput">測驗檔（JSON 內容，可使用 .json 或以 JSON 格式儲存的 .txt）</label>
    <input id="fileInput" type="file" accept=".txt,.json,application/json,text/plain">
    <div class="settings-grid">
      <div>
        <label for="voiceA">說話者 A 語音</label>
        <select id="voiceA"></select>
      </div>
      <div>
        <label for="voiceB">說話者 B 語音</label>
        <select id="voiceB"></select>
      </div>
      <div>
        <label for="rate">語速：<span id="rateLabel">1.0×</span></label>
        <input id="rate" type="range" min="0.75" max="1.15" step="0.05" value="1">
        <p class="hint">TOEIC 練習建議先從 0.9–1.0× 開始。</p>
      </div>
      <div>
        <label for="gap">句間停頓</label>
        <select id="gap">
          <option value="250">短（0.25 秒）</option>
          <option value="500" selected>標準（0.5 秒）</option>
          <option value="800">較長（0.8 秒）</option>
        </select>
      </div>
    </div>
    <div class="actions">
      <button id="loadBtn">載入測驗</button>
      <button id="refreshVoicesBtn" class="secondary">重新載入語音清單</button>
    </div>
    <div id="status" role="status" aria-live="polite">請先選擇測驗檔。若語音清單是空的，請確認裝置已安裝英文語音後再重新載入。</div>
    <p class="hint">注意：部分裝置／瀏覽器的語音可能透過網路提供。此版本不會使用付費 TTS API，但不能保證每一種系統語音都完全離線。</p>
  </section>

  <section class="card" id="player-section">
    <h2>聽力播放</h2>
    <div class="actions">
      <button id="playBtn">▶ 播放對話</button>
      <button id="stopBtn" class="danger">停止</button>
    </div>
    <p class="hint">語音由瀏覽器逐句合成；同一份測驗可重複播放，不會重複呼叫付費 TTS API。</p>
  </section>

  <section class="card" id="quiz-section">
    <h2>測驗題目</h2>
    <div id="questions-container"></div>
    <button id="submitBtn">提交答案</button>
  </section>

  <section class="card" id="result-section">
    <h2 id="score-display"></h2>
    <button id="showTranscriptBtn" class="secondary">顯示／隱藏逐字稿</button>
  </section>
  <section class="card" id="transcript-section">
    <h2>對話逐字稿</h2>
    <div id="transcript-container"></div>
  </section>
</main>

<script>
(() => {
  "use strict";
  let testData = null;
  let isPlaying = false;
  let playToken = 0;
  let availableVoices = [];
  const $ = id => document.getElementById(id);
  const status = $("status");

  function setStatus(message, kind = "") {
    status.textContent = message;
    status.className = kind;
  }

  function loadVoices() {
    if (!("speechSynthesis" in window) || !("SpeechSynthesisUtterance" in window)) {
      setStatus("此瀏覽器不支援 Web Speech API。請改用支援語音合成的最新版 Chrome、Edge 或 Safari。", "error");
      return;
    }
    availableVoices = window.speechSynthesis.getVoices();
    const oldA = $("voiceA").value;
    const oldB = $("voiceB").value;
    for (const select of [$("voiceA"), $("voiceB")]) {
      select.replaceChildren();
      const english = availableVoices.filter(v => /^en(-|$)/i.test(v.lang));
      const list = english.length ? english : availableVoices;
      if (!list.length) {
        const opt = document.createElement("option");
        opt.value = "";
        opt.textContent = "尚未提供語音";
        select.append(opt);
        continue;
      }
      for (const voice of list) {
        const opt = document.createElement("option");
        opt.value = voice.voiceURI;
        opt.textContent = `${voice.name} (${voice.lang})${voice.localService ? " · 裝置語音" : " · 可能使用網路"}`;
        select.append(opt);
      }
    }
    if ([...$("voiceA").options].some(o => o.value === oldA)) $("voiceA").value = oldA;
    if ([...$("voiceB").options].some(o => o.value === oldB)) $("voiceB").value = oldB;
    if (!$("voiceA").value && availableVoices.length) $("voiceA").selectedIndex = 0;
    if (!$("voiceB").value && availableVoices.length) $("voiceB").selectedIndex = Math.min(1, $("voiceB").options.length - 1);
    if (availableVoices.length) {
      setStatus(`已找到 ${availableVoices.length} 種系統語音。請選擇 A、B 的英文語音，再載入測驗。`, "ok");
    } else {
      setStatus("目前沒有可用語音。部分手機會延遲載入語音，請按「重新載入語音清單」；仍無語音時，請在系統設定中安裝英文語音。", "error");
    }
  }

  function validateTest(data) {
    if (!data || !Array.isArray(data.dialogue) || !Array.isArray(data.questions)) {
      throw new Error("測驗檔格式不正確：必須包含 dialogue 與 questions 陣列。");
    }
    data.dialogue.forEach((line, i) => {
      if (!line || typeof line.text !== "string" || !line.text.trim()) {
        throw new Error(`第 ${i + 1} 句對話缺少 text 文字。`);
      }
      if (!["A", "B"].includes(line.speaker)) {
        throw new Error(`第 ${i + 1} 句 speaker 必須是 A 或 B。`);
      }
    });
    data.questions.forEach((q, i) => {
      if (!q || typeof q.question !== "string" || !Array.isArray(q.options) ||
          !Number.isInteger(q.answer) || q.answer < 0 || q.answer >= q.options.length) {
        throw new Error(`第 ${i + 1} 題格式不正確；answer 必須是 options 的零起始索引。`);
      }
    });
  }

  function getVoice(speaker) {
    const id = speaker === "A" ? $("voiceA").value : $("voiceB").value;
    return availableVoices.find(v => v.voiceURI === id) || null;
  }

  function speak(text, voice, token) {
    return new Promise((resolve, reject) => {
      if (token !== playToken) return resolve();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = voice?.lang || "en-US";
      if (voice) utterance.voice = voice;
      utterance.rate = Number($("rate").value);
      utterance.pitch = 1;
      utterance.onend = () => resolve();
      utterance.onerror = event => {
        if (token !== playToken || event.error === "canceled" || event.error === "interrupted") resolve();
        else reject(new Error(`語音播放失敗：${event.error || "unknown error"}`));
      };
      window.speechSynthesis.speak(utterance);
    });
  }

  async function playDialogue() {
    if (!testData || isPlaying) return;
    if (!availableVoices.length) loadVoices();
    if (!availableVoices.length) {
      setStatus("找不到系統語音，無法播放。請重新載入語音清單或安裝英文語音。", "error");
      return;
    }
    isPlaying = true;
    const token = ++playToken;
    $("playBtn").disabled = true;
    $("playBtn").textContent = "播放中…";
    setStatus("正在逐句播放對話。", "");
    try {
      for (let i = 0; i < testData.dialogue.length; i++) {
        if (token !== playToken) break;
        const line = testData.dialogue[i];
        await speak(line.text, getVoice(line.speaker), token);
        if (token !== playToken) break;
        if (i < testData.dialogue.length - 1) {
          await new Promise(resolve => setTimeout(resolve, Number($("gap").value)));
        }
      }
      if (token === playToken) setStatus("播放完成。可再次播放或開始作答。", "ok");
    } catch (error) {
      setStatus(error.message, "error");
    } finally {
      if (token === playToken) {
        isPlaying = false;
        $("playBtn").disabled = false;
        $("playBtn").textContent = "▶ 重新播放對話";
      }
    }
  }

  function stopPlayback() {
    playToken++;
    if ("speechSynthesis" in window) window.speechSynthesis.cancel();
    isPlaying = false;
    $("playBtn").disabled = false;
    $("playBtn").textContent = "▶ 播放對話";
    setStatus("已停止播放。", "");
  }

  function renderQuiz(questions) {
    const container = $("questions-container");
    container.replaceChildren();
    questions.forEach((q, qi) => {
      const block = document.createElement("div");
      block.className = "question";
      const heading = document.createElement("h3");
      heading.textContent = `${qi + 1}. ${q.question}`;
      block.append(heading);
      q.options.forEach((option, oi) => {
        const label = document.createElement("label");
        label.className = "option";
        const input = document.createElement("input");
        input.type = "radio";
        input.name = `q${qi}`;
        input.value = String(oi);
        const text = document.createElement("span");
        text.textContent = String(option);
        label.append(input, text);
        block.append(label);
      });
      container.append(block);
    });
  }

  function renderTranscript(dialogue) {
    const container = $("transcript-container");
    container.replaceChildren();
    dialogue.forEach(line => {
      const div = document.createElement("div");
      div.className = "line";
      const speaker = document.createElement("span");
      speaker.className = `speaker-${line.speaker}`;
      speaker.textContent = `${line.speaker}: `;
      div.append(speaker, document.createTextNode(line.text));
      container.append(div);
    });
  }

  $("loadBtn").addEventListener("click", async () => {
    const file = $("fileInput").files[0];
    if (!file) {
      setStatus("請先選擇測驗檔。", "error");
      return;
    }
    $("loadBtn").disabled = true;
    try {
      const raw = await file.text();
      const parsed = JSON.parse(raw.replace(/^\uFEFF/, ""));
      validateTest(parsed);
      testData = parsed;
      stopPlayback();
      renderQuiz(testData.questions);
      renderTranscript(testData.dialogue);
      $("player-section").style.display = "block";
      $("quiz-section").style.display = "block";
      $("result-section").style.display = "none";
      $("transcript-section").style.display = "none";
      setStatus(`已載入 ${testData.dialogue.length} 句對話與 ${testData.questions.length} 題。語音會在播放時即時合成，不會產生付費 API 用量。`, "ok");
    } catch (error) {
      testData = null;
      setStatus(`載入失敗：${error.message}`, "error");
    } finally {
      $("loadBtn").disabled = false;
    }
  });

  $("playBtn").addEventListener("click", playDialogue);
  $("stopBtn").addEventListener("click", stopPlayback);
  $("refreshVoicesBtn").addEventListener("click", loadVoices);
  $("rate").addEventListener("input", () => $("rateLabel").textContent = `${Number($("rate").value).toFixed(2).replace(/0$/, "")}×`);
  $("submitBtn").addEventListener("click", () => {
    if (!testData) return;
    let score = 0;
    testData.questions.forEach((q, i) => {
      const selected = document.querySelector(`input[name="q${i}"]:checked`);
      if (selected && Number(selected.value) === q.answer) score++;
    });
    $("score-display").textContent = `測驗結果：${score} / ${testData.questions.length}（${Math.round(score / testData.questions.length * 100)}%）`;
    $("result-section").style.display = "block";
    $("result-section").scrollIntoView({behavior:"smooth", block:"start"});
  });
  $("showTranscriptBtn").addEventListener("click", () => {
    const section = $("transcript-section");
    section.style.display = section.style.display === "block" ? "none" : "block";
  });

  if ("speechSynthesis" in window) {
    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;
  } else {
    setStatus("此瀏覽器不支援語音合成。請使用最新版 Safari、Chrome 或 Edge。", "error");
  }
})();
</script>
</body>
</html>
