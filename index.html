<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TOEIC 聽力測驗系統 (ElevenLabs 最新版)</title>
    <style>
        :root { --primary: #0056b3; --bg: #f4f7f6; --card-bg: #ffffff; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); margin: 0; padding: 15px; color: #333; line-height: 1.6; }
        .container { max-width: 600px; margin: 0 auto; background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1, h2 { text-align: center; color: var(--primary); }
        .section { margin-bottom: 20px; padding: 15px; background: #eef2f5; border-radius: 8px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
        input[type="text"], input[type="password"] { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        input[type="file"] { width: 100%; padding: 10px 0; }
        button { width: 100%; background: var(--primary); color: white; border: none; padding: 12px; font-size: 16px; border-radius: 5px; cursor: pointer; margin-top: 10px; font-weight: bold; transition: 0.3s; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        button:hover:not(:disabled) { background: #004494; }
        .question-block { margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #ddd; }
        .option { margin-bottom: 10px; display: flex; align-items: center; }
        .option input { margin-right: 10px; width: 20px; height: 20px; }
        #status { text-align: center; font-weight: bold; margin: 10px 0; color: #d9534f; }
        #audio-section, #quiz-section, #result-section, #transcript-section { display: none; }
        .transcript-line { margin-bottom: 8px; }
        .speaker-A { color: #0056b3; font-weight: bold; }
        .speaker-B { color: #d9534f; font-weight: bold; }
        .hint { font-size: 12px; color: #666; margin-top: -5px; margin-bottom: 10px; display: block; }
    </style>
</head>
<body>

<div class="container">
    <h1>TOEIC 聽力練習</h1>
    
    <div class="section" id="setup-section">
        <label for="apiKey">ElevenLabs API Key:</label>
        <input type="password" id="apiKey" placeholder="輸入 API Key (注意結尾是否有 == 等號)">
        <span class="hint">若一直報錯 401，請檢查複製的 Key 是否少了結尾的 == 等號。</span>
        
        <label for="fileInput">載入測驗檔 (.txt):</label>
        <input type="file" id="fileInput" accept=".txt,.json">
        
        <button id="loadBtn">載入並生成聽力音檔</button>
        <div id="status"></div>
    </div>

    <div class="section" id="audio-section">
        <h2>聽力音檔</h2>
        <button id="playBtn">▶️ 播放對話</button>
        <p style="text-align:center; font-size:14px; color:#666;">(測驗開始前，請先聽完對話)</p>
    </div>

    <div class="section" id="quiz-section">
        <h2>測驗題目</h2>
        <div id="questions-container"></div>
        <button id="submitBtn">提交答案</button>
    </div>

    <div class="section" id="result-section">
        <h2 id="score-display"></h2>
        <button id="showTranscriptBtn">顯示對話逐字稿</button>
    </div>

    <div class="section" id="transcript-section">
        <h2>逐字稿</h2>
        <div id="transcript-container"></div>
    </div>
</div>

<script>
    let testData = null;
    let audioBlobs = [];
    let currentAudioObj = new Audio();
    let isPlaying = false;

    const fileInput = document.getElementById('fileInput');
    const loadBtn = document.getElementById('loadBtn');
    const statusDiv = document.getElementById('status');
    const playBtn = document.getElementById('playBtn');
    
    window.onload = () => {
        const savedKey = localStorage.getItem('elevenLabsApiKey');
        if (savedKey) document.getElementById('apiKey').value = savedKey;
    };

    loadBtn.addEventListener('click', async () => {
        const apiKey = document.getElementById('apiKey').value.trim();
        const file = fileInput.files[0];

        if (!apiKey) return alert("請輸入 API Key");
        if (!file) return alert("請選擇測驗檔案");

        localStorage.setItem('elevenLabsApiKey', apiKey);

        const reader = new FileReader();
        reader.onload = async (e) => {
            try {
                testData = JSON.parse(e.target.result);
                await generateAudios(apiKey, testData);
            } catch (error) {
                statusDiv.innerText = "檔案格式錯誤或生成失敗：" + error.message;
            }
        };
        reader.readAsText(file);
    });

    async function generateAudios(apiKey, data) {
        statusDiv.style.color = "#0056b3";
        statusDiv.innerText = "正在向 ElevenLabs 生成音檔，請稍候...";
        loadBtn.disabled = true;
        audioBlobs = [];

        try {
            // 使用新版官方推薦模型，也可從 txt 檔內覆蓋此設定
            const defaultModelId = data.model_id || "eleven_flash_v2_5";

            for (let i = 0; i < data.dialogue.length; i++) {
                const line = data.dialogue[i];
                const voiceId = line.speaker === 'A' ? data.voice_A : data.voice_B;
                
                statusDiv.innerText = `生成進度: ${i + 1} / ${data.dialogue.length}...`;

                const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${voiceId}?output_format=mp3_44100_128`, {
                    method: 'POST',
                    headers: {
                        'xi-api-key': apiKey,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        text: line.text,
                        model_id: defaultModelId
                    })
                });

                // 新增：提取官方真實的報錯訊息
                if (!response.ok) {
                    let errorMsg = `HTTP ${response.status}`;
                    try {
                        const errObj = await response.json();
                        const detailedError = errObj.detail?.message || errObj.error?.description || JSON.stringify(errObj);
                        errorMsg += ` - ${detailedError}`;
                    } catch (e) {
                        errorMsg += " (無法解析錯誤訊息)";
                    }
                    throw new Error(errorMsg);
                }

                const blob = await response.blob();
                audioBlobs.push(URL.createObjectURL(blob));

                // 防禦機制：句與句之間延遲 800ms，防止觸發免費或方案的 Concurrency (並行) Rate Limit 導致意外 429 或 402
                await new Promise(resolve => setTimeout(resolve, 800));
            }

            statusDiv.innerText = "音檔生成完成！";
            setTimeout(() => { document.getElementById('setup-section').style.display = 'none'; }, 1000);
            
            document.getElementById('audio-section').style.display = 'block';
            document.getElementById('quiz-section').style.display = 'block';
            renderQuiz(data.questions);
            renderTranscript(data.dialogue);

        } catch (error) {
            statusDiv.style.color = "#d9534f";
            statusDiv.innerText = "生成失敗：" + error.message;
            loadBtn.disabled = false;
        }
    }

    playBtn.addEventListener('click', () => {
        if (isPlaying) return;
        isPlaying = true;
        playBtn.innerText = "播放中...";
        playBtn.disabled = true;

        let index = 0;
        function playNext() {
            if (index < audioBlobs.length) {
                currentAudioObj.src = audioBlobs[index];
                currentAudioObj.play();
                currentAudioObj.onended = () => {
                    index++;
                    setTimeout(playNext, 300);
                };
            } else {
                isPlaying = false;
                playBtn.innerText = "▶️ 重新播放";
                playBtn.disabled = false;
            }
        }
        playNext();
    });

    function renderQuiz(questions) {
        const container = document.getElementById('questions-container');
        container.innerHTML = '';
        questions.forEach((q, qIndex) => {
            const qBlock = document.createElement('div');
            qBlock.className = 'question-block';
            qBlock.innerHTML = `<h3>${qIndex + 1}. ${q.question}</h3>`;
            q.options.forEach((opt, optIndex) => {
                const optId = `q${qIndex}_opt${optIndex}`;
                qBlock.innerHTML += `
                    <label class="option" for="${optId}">
                        <input type="radio" name="q${qIndex}" id="${optId}" value="${optIndex}">
                        ${opt}
                    </label>
                `;
            });
            container.appendChild(qBlock);
        });
    }

    function renderTranscript(dialogue) {
        const container = document.getElementById('transcript-container');
        container.innerHTML = '';
        dialogue.forEach(line => {
            const div = document.createElement('div');
            div.className = 'transcript-line';
            div.innerHTML = `<span class="speaker-${line.speaker}">${line.speaker}:</span> ${line.text}`;
            container.appendChild(div);
        });
    }

    document.getElementById('submitBtn').addEventListener('click', () => {
        let score = 0;
        let total = testData.questions.length;
        testData.questions.forEach((q, index) => {
            const selected = document.querySelector(`input[name="q${index}"]:checked`);
            if (selected && parseInt(selected.value) === q.answer) {
                score++;
            }
        });
        document.getElementById('result-section').style.display = 'block';
        document.getElementById('score-display').innerText = `你的分數：${score} / ${total}`;
        document.getElementById('submitBtn').disabled = true;
    });

    document.getElementById('showTranscriptBtn').addEventListener('click', () => {
        document.getElementById('transcript-section').style.display = 'block';
        document.getElementById('showTranscriptBtn').style.display = 'none';
    });
</script>
</body>
</html>
